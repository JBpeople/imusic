name: Build iMusic clients

on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows EXE
            os: windows-latest
            command: pnpm client:windows
            artifact: src/frontend/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS DMG
            os: macos-latest
            command: pnpm client:macos
            artifact: src/frontend/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build client
        run: ${{ matrix.command }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri
      - name: Select Android NDK
        shell: bash
        run: |
          ndk_home="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm client:android:init
      - run: pnpm client:android
      - uses: actions/upload-artifact@v6
        with:
          name: Android APK
          path: src/frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
